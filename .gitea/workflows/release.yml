name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create the release for
        required: true

permissions:
  contents: read
  releases: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: host
    steps:
      - name: Create or update the Gitea release
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          API_URL: ${{ gitea.api_url }}
          REPOSITORY: ${{ gitea.repository }}
          REF_NAME: ${{ gitea.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "not a version tag: $tag" >&2
            exit 1
          fi

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          git clone --quiet --no-checkout "${GITHUB_SERVER_URL}/${REPOSITORY}.git" "$work/repo"
          cd "$work/repo"

          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "tag not found: $tag" >&2
            exit 1
          fi

          version="$(git show "$tag:package.json" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => { process.stdout.write(JSON.parse(input).version); });
          ')"
          if [ "v$version" != "$tag" ]; then
            echo "tag $tag does not match package version $version" >&2
            exit 1
          fi

          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$tag^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            range="$previous..$tag"
          else
            range="$tag"
          fi
          body="$(git log --no-merges --pretty=format:'- %s (%h)' "$range")"
          if [ -z "$body" ]; then
            body="- No changes recorded."
          fi

          prerelease=false
          case "${tag%%+*}" in
            *-*) prerelease=true ;;
          esac

          TAG="$tag" BODY="$body" PRERELEASE="$prerelease" node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              tag_name: process.env.TAG,
              name: process.env.TAG,
              body: process.env.BODY,
              prerelease: process.env.PRERELEASE === "true",
              draft: false,
            }));
          ' "$work/payload.json"

          auth="Authorization: token ${GITEA_TOKEN}"
          api="${API_URL}/repos/${REPOSITORY}/releases"

          status="$(curl --silent --show-error --output "$work/existing.json" --write-out '%{http_code}' \
            --header "$auth" "${api}/tags/${tag}")"
          case "$status" in
            200)
              id="$(node -e '
                const fs = require("node:fs");
                process.stdout.write(String(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).id));
              ' "$work/existing.json")"
              curl --silent --show-error --fail-with-body \
                --request PATCH \
                --header "$auth" \
                --header 'Content-Type: application/json' \
                --data-binary @"$work/payload.json" \
                "${api}/${id}" > "$work/response.json"
              ;;
            404)
              curl --silent --show-error --fail-with-body \
                --request POST \
                --header "$auth" \
                --header 'Content-Type: application/json' \
                --data-binary @"$work/payload.json" \
                "$api" > "$work/response.json"
              ;;
            *)
              cat "$work/existing.json" >&2
              echo "unexpected status ${status} for ${api}/tags/${tag}" >&2
              exit 1
              ;;
          esac

          node -e '
            const fs = require("node:fs");
            const release = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            console.log(`release ${release.tag_name}: ${release.html_url}`);
          ' "$work/response.json"
